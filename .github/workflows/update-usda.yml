# عرضه و تقاضای جهانی از پایگاه PSD وزارت کشاورزی آمریکا (بعد از گزارش ماهانه‌ی WASDE)
# اجرای خودکار: روز ۱۵ هر ماه ساعت ۹ صبح UTC  |  اجرای دستی: تب Actions ← Run workflow
name: Update USDA

on:
  schedule:
    - cron: "0 9 15 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run tests
        run: python -m unittest -v

      - name: Fetch USDA supply and demand
        run: python -m scripts.fetch_usda

      - name: Commit if data changed
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "Data unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update USDA supply and demand"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
