# جمع‌آوری تیتر خبرهای فارسی واردات و گمرک
# خبرخوان‌های فارسی فقط چند ساعت اخیر را دارند، پس هر ۴ ساعت اجرا می‌شود (و اجرای دستی از تب Actions)
name: Update Iran news

on:
  schedule:
    - cron: "45 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iran-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run tests
        run: python -m unittest -v

      - name: Fetch Persian news headlines
        run: python -m scripts.fetch_iran_news

      - name: Commit if news changed
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "News unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update Iran news"
          # اگر workflow دیگری هم‌زمان ذخیره کرده باشد، دوباره تلاش کن
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
