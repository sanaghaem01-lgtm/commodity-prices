# به‌روزرسانی هفتگی قیمت‌ها از FRED
# اجرای خودکار: هر دوشنبه ساعت ۶ صبح UTC  |  اجرای دستی: تب Actions ← Run workflow
name: Update prices

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

# با workflow اخبار در یک صف است تا هم‌زمان در مخزن ذخیره نکنند
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run tests
        run: python -m unittest -v

      - name: Fetch prices from FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m scripts.fetch_prices

      # حتی اگر بعضی کالاها خطا داده باشند، کالاهای سالم ذخیره شوند (اجرا همچنان قرمز می‌ماند)
      - name: Commit if data changed
        if: ${{ !cancelled() }}
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "Data unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update commodity prices"
          git pull --rebase
          git push
